    ports: ['10004:10004']
  lab01-sdk-echo:
    <<: *lab-service
    profiles: [lab01, all]
    command: [python, -m, lab01_direct.servers.sdk_echo]
    environment:
      <<: *lab-env
      A2A_LABS_LAB_ID: "lab01"
