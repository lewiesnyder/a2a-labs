# compose.yaml — a2a-labs (generated skeleton; keep in sync with 06-docker-compose.md and lab specs)
name: a2a-labs

x-ollama-env: &ollama-env
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_API_BASE: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

x-lab-env: &lab-env
  <<: *ollama-env
  LLM_PROVIDER: ${LLM_PROVIDER:-}            # fake in CI (spec 08 §4)
  REASONING_THINK: ${REASONING_THINK:-true}  # `false` for snappy demos; shell value beats .env
  NO_GCE_CHECK: "true"  # google-auth would otherwise probe a GCE metadata server that is not there
  DECISION_PROVIDER: ${DECISION_PROVIDER:-ollama_systemone}
  A2A_LABS_RUNTIME: docker
  A2A_LABS_CONFIG_DIR: /app/config
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_SEMCONV_STABILITY_OPT_IN: gen_ai_latest_experimental
  ADK_SUPPRESS_A2A_EXPERIMENTAL_FEATURE_WARNINGS: "true"

x-lab-deps: &lab-deps
  lgtm: {condition: service_started}
  models-check: {condition: service_completed_successfully}

x-lab-service: &lab-service
  image: a2a-labs:dev
  build: {context: ., dockerfile: docker/Dockerfile}
  extra_hosts: ["host.docker.internal:host-gateway"]
  env_file: [{path: .env, required: false}]
  depends_on: *lab-deps
  restart: unless-stopped
  healthcheck:
    # Agent card for A2A servers; HEALTH_PATH overrides for MCP/registry services
    test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://localhost:'+os.environ['PORT']+os.environ.get('HEALTH_PATH','/.well-known/agent-card.json'),timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 20s

services:
  # ───────────────────────── Infrastructure (always on) ─────────────────────────
  lgtm:
    image: grafana/otel-lgtm:${LGTM_VERSION:-latest}
    ports: ["3000:3000", "${LGTM_OTLP_GRPC_PORT:-4317}:4317", "${LGTM_OTLP_HTTP_PORT:-4318}:4318", "3200:3200", "3100:3100", "9090:9090"]   # UI, OTLP, Tempo, Loki, Prometheus APIs
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/dashboards:/otel-lgtm/a2a-dashboards:ro
      - ./observability/grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/a2a.yaml:ro  # [VERIFY path]
      - lgtm-data:/data

  models-check:
    image: a2a-labs:dev
    build: {context: ., dockerfile: docker/Dockerfile}
    extra_hosts: ["host.docker.internal:host-gateway"]
    env_file: [{path: .env, required: false}]
    environment:
      <<: *lab-env
      SKIP_MODEL_CHECK: ${SKIP_MODEL_CHECK:-false}  # true for non-LLM labs (00, 08, 10)
    command: ["python", "scripts/check_models.py", "--require-all"]
    restart: "no"

  jupyter:
    build: {context: ., dockerfile: docker/jupyter.Dockerfile}
    extra_hosts: ["host.docker.internal:host-gateway"]
    env_file: [{path: .env, required: false}]
    environment:
      <<: *lab-env
      OTEL_SERVICE_NAME: notebook
    ports: ["8888:8888", "9200:9200"]   # 9200 = embedded push receiver (Lab 08)
    # Not `.:/app`: that would hide the image's /app/.venv behind the host's (macOS) venv, DEV-11.
    volumes: ["./notebooks:/app/notebooks", "./labs:/app/labs", "./config:/app/config", "./docs:/app/docs"]
    depends_on:
      lgtm: {condition: service_started}

  # ───────────────────────── Optional: Ollama in a container ─────────────────────────
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}   # >= 0.40.4 required for nimble-v3
    profiles: [ollama]
    ports: ["11434:11434"]
    volumes: ["ollama-models:/root/.ollama"]
    healthcheck: {test: ["CMD", "ollama", "list"], interval: 10s, retries: 30}
    # Uncomment for NVIDIA GPUs:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  ollama-pull:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    profiles: [ollama]
    depends_on: {ollama: {condition: service_healthy}}
    environment: {OLLAMA_HOST: "http://ollama:11434"}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${REASONING_MODEL:-qwen3.8:27b} && ollama pull ${QUICK_MODEL:-llama3.2:latest} && ollama pull ${DECISION_MODEL:-nimble-v3:latest}"]
    restart: "no"

  # ───────────────────────── Shared services ─────────────────────────
  webhook-receiver:
    <<: *lab-service
    profiles: [lab00, lab08, lab10, all]
    command: ["python", "-m", "a2a_labs_webhook.app"]
    environment:
      <<: *lab-env
      OTEL_SERVICE_NAME: webhook-receiver
      PORT: "9100"
      HEALTH_PATH: /healthz
      WEBHOOK_REQUIRE_AUTH: ${WEBHOOK_REQUIRE_AUTH:-false}
    ports: ["9100:9100"]

  lab10-mock-idp:
    image: ghcr.io/navikt/mock-oauth2-server:${MOCK_IDP_VERSION:-2.1.10}   # [VERIFY tag + device-code support]
    profiles: [lab10, all]
    environment:
      SERVER_PORT: "11009"
      JSON_CONFIG_PATH: /config/mock-idp.json
    volumes: ["./config/lab10/mock-idp.json:/config/mock-idp.json:ro"]
    ports: ["11009:11009"]

  lab04-langgraph-agent-server:
    <<: *lab-service
    image: a2a-labs:agentserver
    build: {context: ., dockerfile: docker/agentserver.Dockerfile}
    profiles: [lab04-agentserver]
    working_dir: /app/labs/lab04-langgraph-node
    command: ["langgraph", "dev", "--host", "0.0.0.0", "--port", "10403", "--no-browser", "--no-reload"]
    environment:
      <<: *lab-env
      OTEL_SERVICE_NAME: lab04-langgraph-agent-server
      PORT: "10403"
      HEALTH_PATH: /ok
    ports: ["10403:10403"]

  # ───────────────────────── Tools ─────────────────────────
  a2a-inspector:
    build: {context: "https://github.com/a2aproject/a2a-inspector.git"}   # [VERIFY Dockerfile presence/port]
    profiles: [tools]
    ports: ["5001:8080"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTELCOL_VERSION:-latest}
    profiles: [collector]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/collector/otelcol-config.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["14317:4317", "14318:4318"]

  # ───────────────────────── Lab services ─────────────────────────
  lab00-protocol-agent:
    <<: *lab-service
    profiles: [lab00, all]
    command: [python, -m, lab00_protocol.servers.playground]
    environment:
      <<: *lab-env
      A2A_LABS_LAB_ID: "lab00"
      OTEL_SERVICE_NAME: "lab00-protocol-agent"
      PORT: "10001"
      PLAYGROUND_VARIANT: "full"
    ports: ['10001:10001', '10002:10002']
    depends_on:
      <<: *lab-deps
      webhook-receiver: {condition: service_healthy}
  lab00-protocol-agent-nostream:
    <<: *lab-service
    profiles: [lab00, all]
    command: [python, -m, lab00_protocol.servers.playground]
    environment:
      <<: *lab-env
      A2A_LABS_LAB_ID: "lab00"
      OTEL_SERVICE_NAME: "lab00-protocol-agent-nostream"
      PORT: "10003"
      PLAYGROUND_VARIANT: "nostream"
    ports: ['10003:10003']
  lab00-protocol-agent-nopush:
    <<: *lab-service
    profiles: [lab00, all]
    command: [python, -m, lab00_protocol.servers.playground]
    environment:
      <<: *lab-env
      A2A_LABS_LAB_ID: "lab00"
      OTEL_SERVICE_NAME: "lab00-protocol-agent-nopush"
