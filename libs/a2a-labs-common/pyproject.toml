[project]
name = "a2a-labs-common"
version = "0.1.0"
description = "Shared helpers for the A2A labs: config, models, telemetry, A2A client/server helpers."
requires-python = ">=3.12,<3.13"
dependencies = [
  "a2a-sdk[http-server,fastapi,grpc,telemetry,sqlite,signing]>=1.2.3,<1.3",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
  "starlette>=0.40",
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6",
  "rich>=13",
  "pyjwt[crypto]>=2.9",
  "jwcrypto>=1.5",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp>=1.27",
  "opentelemetry-instrumentation-httpx",
  "opentelemetry-instrumentation-starlette",
  "opentelemetry-instrumentation-fastapi",
  "opentelemetry-instrumentation-grpc",
  "opentelemetry-instrumentation-logging",
]

[project.optional-dependencies]
langchain = [
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "langchain>=1.0",
  "langchain-ollama",
  "langchain-openai",
  "langchain-anthropic",
  "langchain-google-genai",
  "langchain-aws",
  "openinference-instrumentation-langchain",
]
adk = ["google-adk[a2a]>=2.12,<3", "litellm"]
strands = ["strands-agents[ollama,otel,litellm]>=1.57.1", "strands-agents-tools"]
mcp = ["mcp[cli]>=1.2", "langchain-mcp-adapters"]
all = ["a2a-labs-common[langchain,adk,strands,mcp]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_labs_common"]
