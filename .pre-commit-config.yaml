# Local hooks run through uv so they use the pinned workspace tools (spec 02 §6, 07 §4).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check --force-exclude
        language: system
        types: [python]
      - id: nbstripout
        name: strip notebook outputs
        entry: uv run nbstripout
        language: system
        files: \.ipynb$
