[project]
name = "lab01-direct-client"
version = "0.1.0"
description = "Lab 01 — Direct client to agent (A2A pattern 1) with a2a-sdk, ADK, Strands and LangGraph."
requires-python = ">=3.12,<3.13"
dependencies = ["a2a-labs-common[langchain,adk,strands]"]

[project.scripts]
lab01-sdk-echo = "lab01_direct.servers.sdk_echo:main"
lab01-adk-agent = "lab01_direct.servers.adk_agent:main"
lab01-strands-agent = "lab01_direct.servers.strands_agent:main"
lab01-langgraph-agent = "lab01_direct.servers.langgraph_agent:main"

[tool.uv.sources]
a2a-labs-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab01_direct"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"  # several labs share test module names
markers = ["compose: needs running compose profile", "llm: needs a real model", "slow: long"]
