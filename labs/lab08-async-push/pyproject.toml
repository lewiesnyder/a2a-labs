[project]
name = "lab08-async-push"
version = "0.1.0"
description = "Lab 08 — Async work and push notifications (A2A pattern 7): signed webhooks, an SSRF guard, a durable store and a client work queue."
requires-python = ">=3.12,<3.13"
dependencies = ["a2a-labs-common[langchain,adk,strands]", "a2a-labs-webhook-receiver"]

[tool.uv.sources]
a2a-labs-common = { workspace = true }
a2a-labs-webhook-receiver = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab08_push"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"  # several labs share test module names
markers = ["compose: needs running compose profile", "llm: needs a real model", "slow: long"]
