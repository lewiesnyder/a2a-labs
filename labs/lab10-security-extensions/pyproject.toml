[project]
name = "lab10-security-extensions"
version = "0.1.0"
description = "Lab 10 — Security, extended cards, extensions and versioning: transport auth, AUTH_REQUIRED, REJECTED, optional and required extensions, version negotiation."
requires-python = ">=3.12,<3.13"
dependencies = ["a2a-labs-common[langchain,adk,strands]", "a2a-labs-webhook-receiver"]

[tool.uv.sources]
a2a-labs-common = { workspace = true }
a2a-labs-webhook-receiver = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab10_secure"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"  # several labs share test module names
markers = ["compose: needs running compose profile", "llm: needs a real model", "slow: long"]
