[project]
name = "lab05-supervisor-router"
version = "0.1.0"
description = "Lab 05 — Supervisor / router (A2A pattern 4): decision-model routing, a per-remote delegation ledger, fan-out."
requires-python = ">=3.12,<3.13"
# lab02 supplies the three specialists (the same server modules run under lab05 names and ports).
dependencies = ["a2a-labs-common[langchain,adk,strands]", "lab02-agent-as-tool"]

[project.scripts]
lab05-supervisor = "lab05_supervisor.servers.langgraph_supervisor:main"
lab05-adk-coordinator = "lab05_supervisor.servers.adk_coordinator:main"
lab05-strands-graph-supervisor = "lab05_supervisor.servers.strands_graph:main"

[tool.uv.sources]
a2a-labs-common = { workspace = true }
lab02-agent-as-tool = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab05_supervisor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"  # several labs share test module names
markers = ["compose: needs running compose profile", "llm: needs a real model", "slow: long"]
