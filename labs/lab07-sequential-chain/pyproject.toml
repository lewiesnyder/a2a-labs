[project]
name = "lab07-sequential-chain"
version = "0.1.0"
description = "Lab 07 — Sequential chaining (A2A pattern 6): ADK planner, Strands writer, LangGraph editor, an orchestrator and a relay mode."
requires-python = ">=3.12,<3.13"
dependencies = ["a2a-labs-common[langchain,adk,strands]"]

[project.scripts]
lab07-orchestrator = "lab07_chain.servers.orchestrator:main"

[tool.uv.sources]
a2a-labs-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab07_chain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"  # several labs share test module names
markers = ["compose: needs running compose profile", "llm: needs a real model", "slow: long"]
